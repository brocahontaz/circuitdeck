[package]
name = "circuitdeck-backend"
version = "0.1.0"
edition = "2021"
description = "Factorio dashboard API backed by Prometheus metrics (graftorio3)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
time = { version = "0.3", features = ["serde-well-known", "formatting"] }

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"