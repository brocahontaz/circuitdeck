# cargo-deny configuration for the CircuitDeck backend.
# Checks: licenses, RustSec advisories, bans (duplicates), crate sources.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph as built for the production Linux target.
targets = [
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
# SPDX licenses present in the dependency tree as of Cargo.lock (verified by
# running `cargo deny check licenses` against the template allowlist).
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicated dependencies are tolerated for now; failures here would be noise.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []